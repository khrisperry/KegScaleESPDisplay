          base = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/artifacts/"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def request(artifact_id, method="GET"):
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(base + str(artifact_id), headers=headers, method=method)
                      with urllib.request.urlopen(req, timeout=60) as response:
                          return json.load(response) if method == "GET" else None
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          return None
                      if e.code >= 500 and attempt < 4:
                          time.sleep(2 ** attempt)
                          continue
                      raise
          deleted = missing = 0
          freed = 0
          for item in expected:
              artifact = request(item["id"])
              if artifact is None:
                  missing += 1
                  continue
              assert artifact["id"] == item["id"]
              assert artifact["name"] == item["name"]
              assert artifact["created_at"] == item["created"]
              assert artifact["workflow_run"]["head_branch"] == item["branch"]
              assert artifact["created_at"] < "2026-09-29T11:21:58Z"
              size = artifact["size_in_bytes"]
              request(item["id"], "DELETE")
              deleted += 1
              freed += size
              print(f'Deleted artifact {item["id"]}: {item["name"]}')
          summary = f"Deleted {deleted} obsolete artifacts; {missing} already absent. Reclaimed {freed / 1048576:.2f} MiB."
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary + "\n")
          
