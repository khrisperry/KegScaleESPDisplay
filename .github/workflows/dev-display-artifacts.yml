name: Dev e-Ink and Touchscreen build artifacts
on:
  workflow_dispatch:
  push:
    branches:
      - feature/v1.4.24-touchscreen-eink-reliability
  pull_request:
    branches:
      - dev
    paths:
      - 'main/**'
      - 'components/**'
      - 'touchscreen/**'
      - 'tests/**'
      - '.github/workflows/dev-display-artifacts.yml'
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: khrisperry/KegScaleESP
          ref: dev
          path: KegScaleESP
      - run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev libcjson-dev
      - name: Run display tests against companion Scale checkout
        env:
          KEGSCALE_SCALE_ROOT: ${{ github.workspace }}/KegScaleESP
        run: bash tests/run_host_tests.sh
  eink-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32
          path: .
      - name: Package e-Ink app and checksum outside root-owned build directory
        run: |
          mkdir -p "$RUNNER_TEMP/eink-app"
          cp build/keg_scale_display.bin "$RUNNER_TEMP/eink-app/"
          (cd "$RUNNER_TEMP/eink-app" && sha256sum keg_scale_display.bin > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: eink-esp32-dev-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/eink-app/keg_scale_display.bin
            ${{ runner.temp }}/eink-app/SHA256SUMS.txt
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
  touchscreen-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: touchscreen
      - name: Package touchscreen app and checksum outside root-owned build directory
        run: |
          mkdir -p "$RUNNER_TEMP/touchscreen-app"
          cp touchscreen/build/keg_scale_touchscreen.bin "$RUNNER_TEMP/touchscreen-app/"
          (cd "$RUNNER_TEMP/touchscreen-app" && sha256sum keg_scale_touchscreen.bin > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: touchscreen-esp32s3-dev-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/touchscreen-app/keg_scale_touchscreen.bin
            ${{ runner.temp }}/touchscreen-app/SHA256SUMS.txt
            touchscreen/build/bootloader/bootloader.bin
            touchscreen/build/partition_table/partition-table.bin
            touchscreen/build/ota_data_initial.bin
