name: Apply touch-only sleep correction

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/fix-touch-only.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply focused correction
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_touch_only.py
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/main.c main/Kconfig.projbuild version.txt
          git commit -m "Make disabled periodic check-in strictly touch-only"
          git push origin HEAD:dev
