name: Diagnostic firmware (manual installation only)
on:
  workflow_dispatch:
  push:
    branches: ['diagnostic/**']
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y libmbedtls-dev libcjson-dev
      - name: Test bounded recorder behavior
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I tests/recorder_host -I components/flight_recorder/include tests/flight_recorder_test.c -o /tmp/recorder-test
          /tmp/recorder-test
      - run: bash touchscreen/tests/run_host_tests.sh
      - run: bash touchpour/tests/run_host_tests.sh
      # The private Scale workflow performs the cross-repository mirror check.
      # Public Display CI cannot fetch the private Scale with its GITHUB_TOKEN.
      - name: e-Ink host regressions
        run: |
          python3 tests/test_output_contract_test.py
          python3 tests/display_command_ack_guard_test.py
          cc -std=c11 -Wall -Wextra -Werror tests/power_policy_test.c -o /tmp/power-test
          /tmp/power-test
          cc -std=c11 -Wall -Wextra -Werror -Itests/touch_stubs -Icomponents/touch_wake/include tests/touch_calibration_test.c -o /tmp/calibration-test
          /tmp/calibration-test
          python3 tests/run_ota_tests.py
          python3 tests/run_wake_tests.py
      - run: python3 touchscreen43/tests/manual_ota_isolation_test.py
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {path: '.', target: esp32, name: eink}
          - {path: touchscreen, target: esp32s3, name: touchscreen-4b}
          - {path: touchscreen43, target: esp32s3, name: waveshare-43}
          - {path: touchpour, target: esp32s3, name: touchpour}
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
          command: idf.py build
      - name: Package application, debug symbols and build identity
        env:
          PROJECT_DIR: ${{ matrix.path }}
          DEVICE: ${{ matrix.name }}
        run: python3 tools/package_diagnostics.py
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ matrix.name }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: diagnostic-package/
