name: Temporary 4.3-inch connection test
on:
  push:
    branches: [test/waveshare-43-connectivity]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: touchscreen43-${{ github.ref }}
  cancel-in-progress: true
jobs:
  connection-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcjson-dev libmbedtls-dev
      - run: python3 touchscreen/tests/run_connection_test.py
      - run: python3 touchscreen/tests/run_pairing_overlay_test.py
      - run: python3 touchscreen/tests/lvgl_memory_config_test.py
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [touchscreen43, touchscreen]
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: ${{ matrix.project }}
          command: idf.py build && cd build && python -m esptool --chip esp32s3 merge-bin -o firmware-usb.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-usb-test
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ matrix.project }}/build/firmware-usb.bin
            ${{ matrix.project }}/build/keg_scale_*.bin
            ${{ matrix.project }}/build/flasher_args.json
            touchscreen43/README.md
