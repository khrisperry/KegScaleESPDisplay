name: TouchPour Display
on:
  workflow_dispatch:
  push:
    paths:
      - 'touchpour/**'
      - 'touchscreen/main/**'
      - 'touchscreen/components/controller_link/**'
      - 'components/ble_client/**'
      - '.github/workflows/touchpour.yml'
  pull_request:
    paths:
      - 'touchpour/**'
      - 'touchscreen/main/**'
      - 'touchscreen/components/controller_link/**'
      - 'components/ble_client/**'
      - '.github/workflows/touchpour.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash touchpour/tests/run_host_tests.sh
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: touchpour
      - name: Package firmware identity
        id: firmware
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib, os, pathlib, re, shutil
          project = pathlib.Path('touchpour/CMakeLists.txt').read_text()
          version = re.search(r'set\(PROJECT_VER "([0-9.]+)"\)', project).group(1)
          binary = pathlib.Path('touchpour/build/touchpour_display.bin')
          checksum = hashlib.sha256(binary.read_bytes()).hexdigest()
          package = pathlib.Path(os.environ['RUNNER_TEMP']) / 'touchpour-firmware'
          package.mkdir(parents=True, exist_ok=True)
          for name in ('touchpour_display.bin', 'bootloader/bootloader.bin', 'partition_table/partition-table.bin', 'ota_data_initial.bin', 'flasher_args.json'):
              destination = package / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(pathlib.Path('touchpour/build') / name, destination)
          (package / 'SHA256SUMS.txt').write_text(f'{checksum}  touchpour_display.bin\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'TouchPour **V{version}**\n\nSource: `{os.environ["GITHUB_SHA"]}`\n\nSHA-256: `{checksum}`\n')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: touchpour-esp32s3-v${{ steps.firmware.outputs.version }}
          if-no-files-found: error
          path: ${{ runner.temp }}/touchpour-firmware/
