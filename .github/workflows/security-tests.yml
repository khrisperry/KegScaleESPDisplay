name: Display security tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ota-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile eInk OTA authorization policy test
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Itests/touch_stubs \
            -Icomponents/ble_client/include \
            -Imain \
            tests/ota_authorization_policy_test.c \
            -o /tmp/ota_authorization_policy_test

      - name: Run eInk OTA authorization policy test
        run: /tmp/ota_authorization_policy_test
